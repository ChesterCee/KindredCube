# Include this file inside the HTTPS server block that terminates TLS.
# It disables the deprecated protocols and CBC cipher suites reported by scanners.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_tickets off;

# Disable dynamic response compression across this HTTPS host so automated
# BREACH checks also pass on public routes. Static assets can be precompressed.
gzip off;
brotli off;

# Avoid response compression on authenticated API routes to remove BREACH exposure.
location /v1/ {
  proxy_pass http://kindredcube_api;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
