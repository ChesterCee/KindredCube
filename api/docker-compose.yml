services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kindredcube
      POSTGRES_USER: kindred_admin
      POSTGRES_PASSWORD: local-admin-only
    ports:
      - "55432:5432"
    volumes:
      - kindredcube-postgres:/var/lib/postgresql/data
      - ./docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kindred_admin -d kindredcube"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kindredcube-postgres:
